<stylelint-demo>
	<sd-inputs>
		<sd-input-tabs role="tablist" focusgroup="tablist nomemory" aria-label="Inputs">
			<button type="button" role="tab" id="sd-code-tab" aria-selected="true" focusgroupstart>
				Code
			</button>
			<button type="button" role="tab" id="sd-config-tab" aria-selected="false">Config</button>
			<button type="button" role="tab" id="sd-deps-tab" aria-selected="false">Dependencies</button>
		</sd-input-tabs>
		<sd-code role="tabpanel" aria-labelledby="sd-code-tab">
			<label><input type="text" id="sd-code-file-name" aria-label="File name" /></label>
			<sd-code-monaco></sd-code-monaco>
		</sd-code>
		<sd-config role="tabpanel" aria-labelledby="sd-config-tab" hidden>
			<label><select id="sd-config-format" aria-label="Config format"></select></label>
			<sd-config-monaco></sd-config-monaco>
		</sd-config>
		<sd-deps role="tabpanel" aria-labelledby="sd-deps-tab" hidden>
			<label>package.json</label>
			<sd-deps-monaco></sd-deps-monaco>
		</sd-deps>
	</sd-inputs>
	<sd-outputs>
		<sd-output-tabs role="tablist" focusgroup="tablist nomemory" aria-label="Outputs">
			<button type="button" role="tab" id="sd-warnings-tab" aria-selected="true" focusgroupstart>
				Problems<sd-badge></sd-badge>
			</button>
			<button type="button" role="tab" id="sd-console-tab" aria-selected="false">Console</button>
		</sd-output-tabs>
		<sd-warnings role="tabpanel" aria-labelledby="sd-warnings-tab" tabindex="0"></sd-warnings>
		<sd-console role="tabpanel" aria-labelledby="sd-console-tab" hidden
			><sd-xterm-wrapper></sd-xterm-wrapper
		></sd-console>
	</sd-outputs>
	<sd-toolbar>
		<sd-severity-counts></sd-severity-counts>
		<sd-report>
			<a
				href="https://github.com/stylelint/stylelint/issues/new?template=REPORT_A_BUG.yml"
				target="_blank"
				>Report a Stylelint bug</a
			>
		</sd-report>
		<sd-copy-link></sd-copy-link>
	</sd-toolbar>
</stylelint-demo>
